# ===== Saleor 接口性能压测参数 =====
# 用法：
#   jmeter -n -t perftests/saleor-perf.jmx -q perftests/perf.properties \
#          -Jthreads=5 -Jduration=60 -l perftests/results/stage-5.jtl -e -o perftests/results/stage-5-report
#
# 说明：JMeter 命令行以 -J 传入的参数优先级高于本文件，便于做梯度加压。

# ---- 被测服务 ----
host=localhost
port=8000
protocol=http

# ---- 业务参数 ----
# 商品查询与结算所用渠道 slug
channel=default-channel
# 商品列表查询条数
page_size=20

# ---- 鉴权 ----
# 场景B 结算写链路带管理员 Token：实测 checkoutDelete 需要 MANAGE_CHECKOUTS 权限，
# 匿名调用返回 PermissionDenied。setUp 阶段只登录一次，不受登录限流影响。
# 以下为 Saleor 演示数据默认值（与 .env.example 一致），真实环境用 -J 覆盖：
#   -Jadmin_email=you@example.com -Jadmin_password=******
admin_email=admin@example.com
admin_password=admin

# ---- 加压参数（梯度默认值，运行时可被 -J 覆盖）----
# 并发线程数
threads=5
# 加压爬坡时间（秒）
rampup=5
# 单档持续时间（秒）
duration=60