[pytest]
testpaths = testcases uitests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -v -ra --strict-markers --tb=short

markers =
    smoke: 冒烟用例，覆盖主链路
    auth: 鉴权模块
    shop: 店铺与渠道
    product: 商品模块
    cart: 购物车模块
    checkout: 结算下单模块
    order: 订单模块
    account: 账户模块
    datadriven: 数据驱动用例
    security: 安全用例
    negative: 异常场景
    ui: Dashboard UI 用例（需要本地 Dashboard 可访问）
    ui_smoke: UI 冒烟用例

log_cli = false
log_level = INFO